---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
  namespace: system-upgrade
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.12.2
  policy:
    # Options: default, powercycle
    rebootMode: default
    # Set to true to see detailed upgrade progress in logs
    debug: true
  healthChecks:
    # Ensure all nodes are Ready before upgrading
    - description: nodes-ready
      timeout: 5m
      apiVersion: v1
      kind: Node
      expr: |
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
    # Wait for VolSync backups and restores to finish before rebooting a node
    - description: volsync-backups-idle
      timeout: 10m
      apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |
        !has(status.conditions) || !status.conditions.exists(c, c.type == "Synchronizing" && c.status == "True")
    - description: volsync-restores-idle
      timeout: 10m
      apiVersion: volsync.backube/v1alpha1
      kind: ReplicationDestination
      expr: |
        !has(status.conditions) || !status.conditions.exists(c, c.type == "Synchronizing" && c.status == "True")
