---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: alertmanager-secret
    creationPolicy: Owner
  data:
    - secretKey: pushover-token
      remoteRef:
        key: /alertmanager/pushover-token
    - secretKey: pushover-user-key
      remoteRef:
        key: /alertmanager/pushover-user-key
