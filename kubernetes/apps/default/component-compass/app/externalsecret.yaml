---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: component-compass-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: component-compass-secret
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: /scoutui/AUTH_SECRET
    - secretKey: COMPASS_CI_UPLOAD_TOKEN
      remoteRef:
        key: /scoutui/SCOUTUI_CI_UPLOAD_TOKEN
    - secretKey: SCOUTUI_CI_UPLOAD_TOKEN
      remoteRef:
        key: /scoutui/SCOUTUI_CI_UPLOAD_TOKEN
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /scoutui/OIDC_CLIENT_SECRET
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /scoutui/POSTGRES_PASSWORD
