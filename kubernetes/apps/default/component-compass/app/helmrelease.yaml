---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: component-compass
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: component-compass-chart
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:

    image:
      tag: main-738ec40

    serviceAccount:
      create: false
    ingress:
      enabled: true
      className: internal
      annotations:
        gatus.home-operations.com/enabled: "true"
        gatus.home-operations.com/endpoint: |
          ui:
            hide-url: true
            hide-hostname: true
          conditions:
            - "[STATUS] == 200"
          interval: 5m
      hosts:
        - host: &host "compass.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host

    auth:
      url: "https://compass.${SECRET_DOMAIN}"
      sessionSecretRef:
        name: component-compass-secret
        key: AUTH_SECRET
      bearerTokenSecretRef:
        name: component-compass-secret
        key: CC_TOKEN
      oidc:
        issuerUrl: "https://auth.${SECRET_DOMAIN}/application/o/component-compass-dev/"
        clientId: "G56M0CU7aFQMcsR56YPXMXV4SgEI54yIOQfRxzi3"
        clientSecretRef:
          name: component-compass-secret
          key: OIDC_CLIENT_SECRET

    database:
      passwordSecretRef:
        name: component-compass-secret
        key: POSTGRES_PASSWORD

    postgresql:
      enabled: true
      auth:
        existingSecret: component-compass-secret
        secretKeys:
          adminPasswordKey: POSTGRES_PASSWORD
          userPasswordKey: POSTGRES_PASSWORD
      primary:
        persistence:
          storageClass: openebs-hostpath
          size: 2Gi
