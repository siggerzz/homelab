---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: component-compass
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: component-compass-chart
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Deploy decoupled from the chart's appVersion: track the web-app images directly.
    # Renovate digest-pins BOTH `tag` (runner) and `migratorTag` (migrator) — see
    # renovate.json5 — so each new `main` build lands as a value change → rollout.
    # Pin both in lockstep: a floating `main` migratorTag previously skewed against the
    # digest-pinned runner and ran a stale migrator, so a new migration (the `tags`
    # table) silently never applied. Keep both as `main@sha256:…` digests.
    image:
      repository: ghcr.io/siggerzz/component-compass-web-app
      tag: main@sha256:f61403d6a9a7c0827fc158f4317d6ce7f33c9ea0596b9d96d1e91efaea03684d
      # renovate: datasource=docker depName=ghcr.io/siggerzz/component-compass-web-app-migrator
      migratorTag: main@sha256:f846388adda0a7dcc53cf0482c0d986f709d555ec8fdb81a8664c0882fc4119c
      pullPolicy: Always

    securityContext:
      readOnlyRootFilesystem: false

    serviceAccount:
      create: false
    ingress:
      enabled: true
      className: external
      annotations:
        external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        gatus.home-operations.com/enabled: "true"
        gatus.home-operations.com/endpoint: |
          ui:
            hide-url: true
            hide-hostname: true
          conditions:
            - "[STATUS] == 200"
          interval: 5m
      hosts:
        - host: &host "compass.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host

    auth:
      url: "https://compass.${SECRET_DOMAIN}"
      sessionSecretRef:
        name: component-compass-secret
        key: AUTH_SECRET
      cliTokenSecretRef:
        name: component-compass-secret
        key: CLI_TOKEN_SECRET
      oidc:
        issuerUrl: "https://auth.${SECRET_DOMAIN}/application/o/component-compass-dev/"
        clientId: "G56M0CU7aFQMcsR56YPXMXV4SgEI54yIOQfRxzi3"
        clientSecretRef:
          name: component-compass-secret
          key: OIDC_CLIENT_SECRET

    database:
      passwordSecretRef:
        name: component-compass-secret
        key: POSTGRES_PASSWORD

    postgresql:
      enabled: true
      global:
        security:
          allowInsecureImages: true
      image:
        repository: bitnamilegacy/postgresql
      volumePermissions:
        image:
          repository: bitnamilegacy/os-shell
      auth:
        existingSecret: component-compass-secret
        secretKeys:
          adminPasswordKey: POSTGRES_PASSWORD
          userPasswordKey: POSTGRES_PASSWORD
      primary:
        persistence:
          storageClass: openebs-hostpath
          size: 2Gi
