---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: component-compass
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: component-compass-chart
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Deploy decoupled from the chart's appVersion: track the web-app image directly.
    # Renovate digest-pins `tag` (see renovate.json5), so each new `main` build lands
    # as a value change → rollout, independent of chart releases. The migrator is a
    # distinct image; it rides the mutable `main` tag with Always so it re-pulls in
    # sync with the runner each migration Job.
    image:
      repository: ghcr.io/siggerzz/component-compass-web-app
      tag: main@sha256:0c3444683e1c6cd9fa408fb26ae9193ffb597e66fd934eb665a2e7709a83c9be
      migratorTag: main
      pullPolicy: Always

    securityContext:
      readOnlyRootFilesystem: false

    serviceAccount:
      create: false
    ingress:
      enabled: true
      className: internal
      annotations:
        gatus.home-operations.com/enabled: "true"
        gatus.home-operations.com/endpoint: |
          ui:
            hide-url: true
            hide-hostname: true
          conditions:
            - "[STATUS] == 200"
          interval: 5m
      hosts:
        - host: &host "compass.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host

    auth:
      url: "https://compass.${SECRET_DOMAIN}"
      sessionSecretRef:
        name: component-compass-secret
        key: AUTH_SECRET
      cliTokenSecretRef:
        name: component-compass-secret
        key: CLI_TOKEN_SECRET
      oidc:
        issuerUrl: "https://auth.${SECRET_DOMAIN}/application/o/component-compass-dev/"
        clientId: "G56M0CU7aFQMcsR56YPXMXV4SgEI54yIOQfRxzi3"
        clientSecretRef:
          name: component-compass-secret
          key: OIDC_CLIENT_SECRET

    database:
      passwordSecretRef:
        name: component-compass-secret
        key: POSTGRES_PASSWORD

    postgresql:
      enabled: true
      global:
        security:
          allowInsecureImages: true
      image:
        repository: bitnamilegacy/postgresql
      volumePermissions:
        image:
          repository: bitnamilegacy/os-shell
      auth:
        existingSecret: component-compass-secret
        secretKeys:
          adminPasswordKey: POSTGRES_PASSWORD
          userPasswordKey: POSTGRES_PASSWORD
      primary:
        persistence:
          storageClass: openebs-hostpath
          size: 2Gi
