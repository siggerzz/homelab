---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: component-compass
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: component-compass-chart
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Deploy decoupled from the chart's appVersion: track the web-app image directly.
    # Renovate digest-pins the runner `tag` — see renovate.json5 — so each new `main`
    # build lands as a value change → rollout. The runner applies migrations on start.
    image:
      repository: ghcr.io/siggerzz/component-compass-web-app
      tag: main@sha256:1cc8c0ceb8354a0de38c2b0c961136810121d280a7429e31c4aad5ac069d5c17
      pullPolicy: Always

    # Chart default (512Mi limit) OOM-killed the SSR process — V8 heap died at
    # ~254MB rendering tag/component pages over the grown dataset. Bump so the
    # cgroup-aware Node heap has headroom.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    securityContext:
      readOnlyRootFilesystem: false

    serviceAccount:
      create: false
    ingress:
      enabled: true
      className: external
      annotations:
        external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        gatus.home-operations.com/enabled: "true"
        gatus.home-operations.com/endpoint: |
          ui:
            hide-url: true
            hide-hostname: true
          conditions:
            - "[STATUS] == 200"
          interval: 5m
      hosts:
        - host: &host "compass.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host

    auth:
      url: "https://compass.${SECRET_DOMAIN}"
      sessionSecretRef:
        name: component-compass-secret
        key: AUTH_SECRET
      cliTokenSecretRef:
        name: component-compass-secret
        key: CLI_TOKEN_SECRET
      oidc:
        issuerUrl: "https://auth.${SECRET_DOMAIN}/application/o/component-compass-dev/"
        clientId: "G56M0CU7aFQMcsR56YPXMXV4SgEI54yIOQfRxzi3"
        clientSecretRef:
          name: component-compass-secret
          key: OIDC_CLIENT_SECRET

    database:
      passwordSecretRef:
        name: component-compass-secret
        key: POSTGRES_PASSWORD

    postgresql:
      enabled: true
      global:
        security:
          allowInsecureImages: true
      image:
        repository: bitnamilegacy/postgresql
      volumePermissions:
        image:
          repository: bitnamilegacy/os-shell
      auth:
        existingSecret: component-compass-secret
        secretKeys:
          adminPasswordKey: POSTGRES_PASSWORD
          userPasswordKey: POSTGRES_PASSWORD
      primary:
        # 512Mi OOM-killed Postgres ingesting a 41MB scan artifact (one jsonb
        # value parsed and compressed in a single INSERT).
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        persistence:
          storageClass: openebs-hostpath
          size: 2Gi
