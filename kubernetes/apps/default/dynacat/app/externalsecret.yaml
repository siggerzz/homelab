---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dynacat-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dynacat-secret
    creationPolicy: Owner
  data:
    - secretKey: ADGUARD_USERNAME
      remoteRef:
        key: /homepage/HOMEPAGE_VAR_ADGUARD_USERNAME
    - secretKey: ADGUARD_PASSWORD
      remoteRef:
        key: /homepage/HOMEPAGE_VAR_ADGUARD_PASSWORD
    - secretKey: UNIFI_HOST
      remoteRef:
        key: /homepage/HOMEPAGE_VAR_UNIFI_HOST
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: /homepage/HOMEPAGE_VAR_UNIFI_API_KEY
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: /dynacat/GITHUB_TOKEN
