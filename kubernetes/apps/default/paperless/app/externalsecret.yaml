---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: paperless-secret
    creationPolicy: Owner
    template:
      data:
        PAPERLESS_SECRET_KEY: "{{ .SECRET_KEY }}"
        PAPERLESS_ADMIN_USER: "{{ .ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        # provider_id "authentik" sets the callback URL: /accounts/oidc/authentik/login/callback/
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {"openid_connect": {"APPS": [{"provider_id": "authentik", "name": "Authentik", "client_id": "{{ .OIDC_CLIENT_ID }}", "secret": "{{ .OIDC_CLIENT_SECRET }}", "settings": {"server_url": "https://auth.${SECRET_DOMAIN}/application/o/paperless/.well-known/openid-configuration"}}]}}
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: /paperless/SECRET_KEY
    - secretKey: ADMIN_USER
      remoteRef:
        key: /paperless/ADMIN_USER
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: /paperless/ADMIN_PASSWORD
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /paperless/OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /paperless/OIDC_CLIENT_SECRET
