---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: norish-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: norish-secret
    creationPolicy: Owner
    template:
      data:
        MASTER_KEY: "{{ .MASTER_KEY }}"
        OBSCURA_CDP_TOKEN: "{{ .OBSCURA_CDP_TOKEN }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        DATABASE_URL: "postgres://norish:{{ .POSTGRES_PASSWORD }}@norish-postgres:5432/norish"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        PGPASSWORD: "{{ .POSTGRES_PASSWORD }}"
  data:
    - secretKey: MASTER_KEY
      remoteRef:
        key: /norish/MASTER_KEY
    - secretKey: OBSCURA_CDP_TOKEN
      remoteRef:
        key: /norish/OBSCURA_CDP_TOKEN
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /norish/POSTGRES_PASSWORD
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: /norish/OIDC_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /norish/OIDC_CLIENT_SECRET
