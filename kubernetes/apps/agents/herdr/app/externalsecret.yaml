---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: herdr-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: herdr-secret
    creationPolicy: Owner
  data:
    # Fine-grained PAT scoped to specific repos. Never include siggerzz/homelab:
    # main can't be protected on this plan, and Flux applies whatever lands there.
    - secretKey: GH_TOKEN
      remoteRef:
        key: /herdr/GITHUB_TOKEN
