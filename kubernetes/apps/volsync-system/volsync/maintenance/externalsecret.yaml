---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-maintenance
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: volsync-maintenance-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: filesystem:///mnt/repository
        KOPIA_FS_PATH: /mnt/repository
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: /volsync/KOPIA_PASSWORD
