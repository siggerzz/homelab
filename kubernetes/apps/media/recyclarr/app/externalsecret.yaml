---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: recyclarr-secret
    creationPolicy: Owner
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: /homepage/HOMEPAGE_VAR_SONARR_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: /homepage/HOMEPAGE_VAR_RADARR_API_KEY
