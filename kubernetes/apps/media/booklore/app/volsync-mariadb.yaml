---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: booklore-mariadb
spec:
  sourcePVC: booklore-mariadb
  trigger:
    schedule: "0 2 * * *"
  kopia:
    repository: "${APP}-volsync-secret"
    copyMethod: Direct
    compression: zstd-fastest
    parallelism: 2
    cacheCapacity: 1Gi
    cacheStorageClassName: openebs-hostpath
    cacheAccessModes:
      - ReadWriteOnce
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            server: "${NAS_IP}"
            path: /var/nfs/shared/k8s/volsync
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    retain:
      latest: 0
      hourly: 0
      daily: 7
      weekly: 4
      monthly: 6
      yearly: 0
