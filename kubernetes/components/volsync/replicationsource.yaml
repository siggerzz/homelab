---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: "${VOLSYNC_CLAIM}"
spec:
  sourcePVC: "${VOLSYNC_CLAIM}"
  trigger:
    schedule: "0 2 * * *"
  kopia:
    repository: "${APP}-volsync-secret"
    copyMethod: Direct
    compression: zstd-fastest
    parallelism: 2
    cacheCapacity: 1Gi
    cacheStorageClassName: openebs-hostpath
    cacheAccessModes:
      - ReadWriteOnce
    moverVolumes:
      - mountPath: repository
        volumeSource:
          nfs:
            server: "${NAS_IP}"
            path: /var/nfs/shared/k8s/volsync
    moverSecurityContext:
      runAsUser: ${VOLSYNC_UID:=1000}
      runAsGroup: ${VOLSYNC_GID:=1000}
      fsGroup: ${VOLSYNC_GID:=1000}
    # Unset rules fall back to kopia defaults (24 monthly, 3 annual), so set every one
    retain:
      latest: 0
      hourly: 0
      daily: 7
      weekly: 4
      monthly: 6
      yearly: 0
