cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      # Pinned so moving the cluster endpoint to the Homelab VLAN doesn't invalidate SA tokens
      service-account-issuer: https://192.168.1.10:6443
      # Talos derives api-audiences from the endpoint; keep accepting tokens minted for the old one
      api-audiences: https://192.168.10.10:6443,https://192.168.1.10:6443
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    # Homelab VLAN migration: advertise 10.x first, keep 1.x until cleanup
    advertisedSubnets:
      - 192.168.10.0/24
      - 192.168.1.0/24
    listenSubnets:
      - 192.168.1.0/24
      - 192.168.10.0/24
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
