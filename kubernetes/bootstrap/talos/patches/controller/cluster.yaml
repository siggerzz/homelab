cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      # Kept at the pre-VLAN endpoint on purpose: changing the issuer invalidates every SA token,
      # and Talos extraArgs can't list a second issuer to roll it over
      service-account-issuer: https://192.168.1.10:6443
      # Talos derives api-audiences from the endpoint; also accept tokens minted for the old one
      api-audiences: https://192.168.10.10:6443,https://192.168.1.10:6443
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.10.0/24
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
