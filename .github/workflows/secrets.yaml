---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Secrets"

on:
  pull_request:
    branches: ["main"]
  # Renovate's branch automerges never open a PR, so check their branches on push
  push:
    branches: ["renovate/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --no-banner --redact -v /github/workspace

  sops:
    name: SOPS Encrypted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail on unencrypted SOPS files
        run: |
          status=0
          for f in $(git ls-files | grep -E '\.sops\.ya?ml$' | grep -v '^\.sops\.yaml$'); do
            if ! grep -q '^sops:' "$f"; then
              echo "::error file=$f::not encrypted, run: sops --encrypt --in-place $f"
              status=1
            fi
          done
          exit $status
